name: Build 2 Android APK (Admin & Warga)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Install Dependencies
      run: npm install

    - name: Build Web App (Next.js)
      run: npm run build

    # ═══════════════════════════════════════════
    # 1. BUILD APLIKASI WARGA
    # ═══════════════════════════════════════════
    - name: Tulis google-services.json (Warga)
      run: echo '${{ secrets.GOOGLE_SERVICES_WARGA }}' | base64 -d > android/app/google-services.json

    - name: Capacitor Sync (Warga)
      run: npm run cap:warga

    - name: Build APK (Warga)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
        mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/RT38-Warga.apk

    - name: Upload APK (Warga)
      uses: actions/upload-artifact@v4
      with:
        name: RT38-Warga-APK
        path: android/app/build/outputs/apk/debug/RT38-Warga.apk

    # ═══════════════════════════════════════════
    # 2. BUILD APLIKASI ADMIN
    # ═══════════════════════════════════════════
    - name: Ubah Application ID ke Admin
      run: |
        sed -i 's/com.rt38.warga/com.rt38.admin/g' android/app/build.gradle

    - name: Tulis google-services.json (Admin)
      run: echo '${{ secrets.GOOGLE_SERVICES_ADMIN }}' | base64 -d > android/app/google-services.json

    - name: Capacitor Sync (Admin)
      run: npm run cap:admin

    - name: Build APK (Admin)
      run: |
        cd android
        ./gradlew assembleDebug
        mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/RT38-Admin.apk

    - name: Upload APK (Admin)
      uses: actions/upload-artifact@v4
      with:
        name: RT38-Admin-APK
        path: android/app/build/outputs/apk/debug/RT38-Admin.apk
