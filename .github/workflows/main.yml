name: Build 2 Android APK (Admin & Warga)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Install Dependencies
      run:  npm install

    - name: Build Web App (Next.js)
      run: npm run build

    # ═══════════════════════════════════════════
    # 1. BUILD APLIKASI WARGA
    # ═══════════════════════════════════════════
    - name: Tulis google-services.json (Warga)
      run: echo '${{ secrets.GOOGLE_SERVICES_WARGA }}' | base64 -d > android/app/google-services.json

    - name: Capacitor Sync (Warga)
      run: npm run cap:warga

    - name: Build APK (Warga)
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
        mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/RT38-Warga.apk

    - name: Upload APK (Warga)
      uses: actions/upload-artifact@v4
      with:
        name: RT38-Warga-APK
        path: android/app/build/outputs/apk/debug/RT38-Warga.apk

    # ═══════════════════════════════════════════
    # 2. BUILD APLIKASI ADMIN (DIPISAH TOTAL)
    # ═══════════════════════════════════════════
    - name: Ubah ID, Nama, dan Namespace ke Admin
      run: |
        # 1. Ubah ID Paket di build.gradle
        sed -i 's/com.rt38.warga/com.rt38.admin/g' android/app/build.gradle
        
        # 2. Ubah Nama Aplikasi di strings.xml
        sed -i 's/RT 38/RT 38 Admin/g' android/app/src/main/res/values/strings.xml
        
        # 3. Ubah Package Name di strings.xml
        sed -i 's/com.rt38.warga/com.rt38.admin/g' android/app/src/main/res/values/strings.xml
        
        # 4. Ubah Namespace di AndroidManifest.xml
        sed -i 's/com.rt38.warga/com.rt38.admin/g' android/app/src/main/AndroidManifest.xml
        
        # 5. Pindahkan folder Java asli Capacitor ke folder Admin
        mkdir -p android/app/src/main/java/com/rt38/admin
        mv android/app/src/main/java/com/rt38/warga/MainActivity.java android/app/src/main/java/com/rt38/admin/ 2>/dev/null || true
        
        # 6. Ubah isi file MainActivity.java
        sed -i 's/package com.rt38.warga;/package com.rt38.admin;/g' android/app/src/main/java/com/rt38/admin/MainActivity.java

    - name: Tulis google-services.json (Admin)
      run: echo '${{ secrets.GOOGLE_SERVICES_ADMIN }}' | base64 -d > android/app/google-services.json

    - name: Capacitor Sync (Admin)
      run: npm run cap:admin

    - name: Build APK (Admin)
      run: |
        cd android
        ./gradlew assembleDebug
        mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/RT38-Admin.apk

    - name: Upload APK (Admin)
      uses: actions/upload-artifact@v4
      with:
        name: RT38-Admin-APK
        path: android/app/build/outputs/apk/debug/RT38-Admin.apk
